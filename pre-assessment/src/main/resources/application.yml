spring:
  application:
    name: planet-express
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/planetexpress}
    username: ${DB_USER:planetexpress}
    password: ${DB_PASSWORD:planetexpress}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.postman.planetexpress: DEBUG
