# Profile for the command-line interface: no web server, and only the CLI's own output
# on the console (the default profile logs SQL and DEBUG for the service).
spring:
  main:
    web-application-type: none
    banner-mode: "off"
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.postman.planetexpress: WARN
